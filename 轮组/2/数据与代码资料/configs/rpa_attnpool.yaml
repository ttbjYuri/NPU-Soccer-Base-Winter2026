# 消融 D：全局聚合从 max 换成注意力池化，用来验证对离群点的鲁棒性
# 用法：python train.py --config configs/rpa_attnpool.yaml

exp_name: rpa_attnpool
output_dir: runs

model:
  name: rpa
  num_classes: 5
  in_channels: 3
  local_dim: 64
  global_dim: 1024
  k: 16
  num_blocks: 2
  num_heads: 4
  r_max: 4.0
  use_rpe: true
  agg: attn
  global_pool: attn
  dropout: 0.3

data:
  root: data/course
  num_points: 4096
  ignore_index: 255
  augment:
    rotate_z: true
    random_drop_ratio: 0.30
    jitter_std: 0.01
    scale_range: null

train:
  batch_size: 8
  epochs: 120
  lr: 0.001
  weight_decay: 0.0001
  lr_schedule: cosine
  grad_clip: 1.0
  eval_every: 5
  seed: 0

eval:
  num_points: 8192          # 每帧评测采样点数；null 表示跟训练侧一致

