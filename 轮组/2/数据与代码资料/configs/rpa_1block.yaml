# 消融 C：只保留 1 个注意力块，用来分离"深度"与"机制"的贡献
# 用法：python train.py --config configs/rpa_1block.yaml

exp_name: rpa_1block
output_dir: runs

model:
  name: rpa
  num_classes: 5
  in_channels: 3
  local_dim: 64
  global_dim: 1024
  k: 16
  num_blocks: 1
  num_heads: 4
  r_max: 4.0
  use_rpe: true
  agg: attn
  global_pool: max
  dropout: 0.3

data:
  root: data/course
  num_points: 4096
  ignore_index: 255
  augment:
    rotate_z: true
    random_drop_ratio: 0.30
    jitter_std: 0.01
    scale_range: null

train:
  batch_size: 8
  epochs: 120
  lr: 0.001
  weight_decay: 0.0001
  lr_schedule: cosine
  grad_clip: 1.0
  eval_every: 5
  seed: 0

eval:
  num_points: 8192          # 每帧评测采样点数；null 表示跟训练侧一致

